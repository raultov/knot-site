<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found · Knot</title>
    <meta name="description" content="The page you are looking for does not exist." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/webp" href="/favicon-32.webp" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --bg-primary: #000000;
        --bg-secondary: #161b22;
        --bg-tertiary: #21262d;
        --border-color: #30363d;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
        --radius: 8px;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial,
          sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        background-image:
          linear-gradient(rgba(48, 54, 61, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(48, 54, 61, 0.12) 1px, transparent 1px);
        background-size: 60px 60px;
        background-position: -30px -30px;
        color: var(--text-primary);
        line-height: 1.6;
        padding: 24px;
      }
      main {
        max-width: 560px;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }
      .logo img {
        width: 28px;
        height: 28px;
      }
      .logo span {
        font-weight: 700;
        font-size: 1.25rem;
        color: var(--text-primary);
      }
      .code {
        font-family: var(--font-mono);
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(1.3rem, 3.5vw, 1.6rem);
        margin-bottom: 12px;
      }
      p {
        color: var(--text-secondary);
        margin-bottom: 36px;
      }
      a.home {
        display: inline-block;
        padding: 10px 22px;
        background-color: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        color: var(--text-primary);
        text-decoration: none;
        font-weight: 600;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }
      a.home:hover {
        border-color: var(--accent);
        color: var(--accent-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/" aria-label="Knot home">
        <img src="/favicon.png" alt="" width="28" height="28" />
        <span>Knot</span>
      </a>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>
        The page you are looking for does not exist or has moved. Try heading back to the
        homepage.
      </p>
      <a class="home" href="/">Back to home</a>
    </main>
  </body>
</html>
